[global]
# Minimal config on purpose: everything not listed uses nhost defaults.
# The JWT key below is normally managed by nhost Cloud, but nhost.toml must
# declare a complete jwtSecrets entry or cloud config validation fails
# ("hasura.jwtSecrets.0: incomplete value") and the deployment is rejected.

[hasura]
version = "v2.48.10-ce"

# HS256 JWT signing/verification key shared by auth and GraphQL services.
[[hasura.jwtSecrets]]
type = "HS256"
key = "07ce04e06d7ebcb7aaaae3959d7c7c184bbeb1f25140730759ac12620c546cf7"

[hasura.settings]
# Allow the React frontend (Vercel) to call the GraphQL API from the browser.
corsDomain = ["*"]

[auth]

[auth.signUp]
enabled = true

[auth.redirections]
clientUrl = "http://localhost:3000"
allowedUrls = ["http://localhost:3000"]

[auth.method.emailPassword]
# Test project: skip email verification so signups work without delivering mail.
emailVerificationRequired = false
# nhost enforces a minimum of 9; keep it explicit for seed/test accounts.
passwordMinLength = 9

[functions]
[functions.node]
version = 22