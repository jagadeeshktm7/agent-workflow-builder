[global]
# Minimal config on purpose: everything not listed uses nhost defaults.
# Per the nhost config schema (schema.cue), the following fields are REQUIRED
# and have no defaults — the cloud config validator rejects the deploy if they
# are missing or incomplete:
#   - hasura.jwtSecrets     (JWT signing/verification key)
#   - hasura.adminSecret
#   - hasura.webhookSecret
#   - postgres.resources.storage.capacity
#   - observability.grafana.adminPassword
# GEMINI_API_KEY is injected via the project Secret of the same name (Settings →
# Secrets in the dashboard); the template below resolves at deploy time so the
# key itself never enters the repository.

[[global.environment]]
name = "GEMINI_API_KEY"
value = "{{ secrets.GEMINI_API_KEY }}"

[hasura]
version = "v2.48.10-ce"
adminSecret = "d48f3d4e0317c6ce954be8f4a3f7eab1f88c5d0a7e6a9a042e7d6f617239a81c"
webhookSecret = "e3c49fa2fe41b182c9178f487a6b91df60d93972c5a548bf53160835dcf05866"

# HS256 JWT signing/verification key shared by auth and GraphQL services.
[[hasura.jwtSecrets]]
type = "HS256"
key = "07ce04e06d7ebcb7aaaae3959d7c7c184bbeb1f25140730759ac12620c546cf7"

[hasura.settings]
# Allow the React frontend (Vercel) to call the GraphQL API from the browser.
corsDomain = ["*"]

[auth]

[auth.signUp]
enabled = true

[auth.redirections]
clientUrl = "http://localhost:3000"
allowedUrls = ["http://localhost:3000"]

[auth.method.emailPassword]
# Test project: skip email verification so signups work without delivering mail.
emailVerificationRequired = false
# nhost enforces a minimum of 9; keep it explicit for seed/test accounts.
passwordMinLength = 9

# 1 GiB persistent disk — the nhost free-tier default.
[postgres.resources.storage]
capacity = 1

# Grafana is part of the mandatory observability config; adminPassword has no
# default. Not used — value is random.
[observability.grafana]
adminPassword = "kIBO4TeKJRkIRUah23aTd/GCFmjOc+gz"

[functions]
[functions.node]
version = 22