table:
  name: workflows
  schema: public
object_relationships:
  - name: org
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        insertion_order: null
        remote_table:
          name: organizations
          schema: public
array_relationships:
  - name: workflow_runs
    using:
      manual_configuration:
        column_mapping:
          id: workflow_id
        insertion_order: null
        remote_table:
          name: workflow_runs
          schema: public
  - name: workflow_steps
    using:
      manual_configuration:
        column_mapping:
          id: workflow_id
        insertion_order: null
        remote_table:
          name: workflow_steps
          schema: public
  - name: workflow_triggers
    using:
      manual_configuration:
        column_mapping:
          id: workflow_id
        insertion_order: null
        remote_table:
          name: workflow_triggers
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns: '*'
  - role: owner
    permission:
      check:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
