table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      manual_configuration:
        column_mapping:
          workflow_id: id
        insertion_order: null
        remote_table:
          name: workflows
          schema: public
array_relationships:
