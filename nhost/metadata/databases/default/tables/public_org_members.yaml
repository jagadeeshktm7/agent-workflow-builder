table:
  name: org_members
  schema: public
object_relationships:
  - name: org
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        insertion_order: null
        remote_table:
          name: organizations
          schema: public
  - name: user
    using:
      manual_configuration:
        column_mapping:
          user_id: id
        insertion_order: null
        remote_table:
          name: users
          schema: auth
insert_permissions:
  - role: owner
    permission:
      check:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        org:
