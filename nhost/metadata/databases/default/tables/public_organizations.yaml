table:
  name: organizations
  schema: public
array_relationships:
  - name: org_members
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_members
          schema: public
  - name: workflow_runs
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: workflow_runs
          schema: public
  - name: workflows
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: workflows
          schema: public
insert_permissions:
  - role: owner
    permission:
      check:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
      check:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
delete_permissions:
  - role: owner
    permission:
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
