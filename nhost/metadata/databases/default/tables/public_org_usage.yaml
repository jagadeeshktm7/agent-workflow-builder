table:
  name: org_usage
  schema: public
object_relationships:
  - name: org
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        insertion_order: null
        remote_table:
          name: organizations
          schema: public
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
